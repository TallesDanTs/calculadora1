<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculadora">
        <h1>Calculadora</h1>
        <input type="number" name="txt1" id="txt1">
        <input type="number" name="txt2" id="txt2">

        <br><br>

        <h2>Operadores Aritiméticos</h2>

        <button id="somar">+</button>
        <button id="subtracao">-</button>
        <button id="multiplicar">*</button>
        <button id="divisao">/</button>
        <button id="resto">%</button>
        <button id="expon">**</button>

        <br><br>

        <h2>Operadores Relacionais</h2>

        <button id="maiorque">></button>
        <button id="maiorigual">>=</button>
        <button id="menorque"><</button>
        <button id="menorigual"><=</button>
        <button id="igual">==</button>
        <button id="diferente">!=</button>

        
        <h2 id="res">Resultado</h2>



    </div>


    <script src="script.js"></script>
</body>
</html>
